name: Build RPK

on:
  push:
    branches: [main]
    paths:
      - 'vela/**'
      - '.github/workflows/build-rpk.yml'
  pull_request:
    paths:
      - 'vela/**'
      - '.github/workflows/build-rpk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: band
            output: xiaomi_band.rpk
          - project: band_pro
            output: xiaomi_band_pro.rpk
          - project: circle_watch
            output: xiaomi_circle_band.rpk
    name: ${{ matrix.output }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vela/${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: vela/${{ matrix.project }}
        run: npm ci --no-audit --no-fund

      - name: Restore signing keys
        working-directory: vela/${{ matrix.project }}
        env:
          SIGN_CERTIFICATE_PEM: ${{ secrets.SIGN_CERTIFICATE_PEM }}
          SIGN_PRIVATE_PEM: ${{ secrets.SIGN_PRIVATE_PEM }}
        run: |
          if [ -z "$SIGN_PRIVATE_PEM" ] || [ -z "$SIGN_CERTIFICATE_PEM" ]; then
            echo "::error::SIGN_CERTIFICATE_PEM / SIGN_PRIVATE_PEM secrets are required to build release rpks"
            exit 1
          fi
          mkdir -p sign/release
          printf '%s\n' "$SIGN_CERTIFICATE_PEM" > sign/release/certificate.pem
          printf '%s\n' "$SIGN_PRIVATE_PEM" > sign/release/private.pem

      - name: Build
        working-directory: vela/${{ matrix.project }}
        run: npm run release

      - name: Collect artifact
        run: |
          shopt -s nullglob
          rpks=(vela/${{ matrix.project }}/dist/*.rpk)
          if [ ${#rpks[@]} -ne 1 ]; then
            echo "::error::expected exactly one rpk in dist/, found: ${rpks[*]}"
            exit 1
          fi
          mv "${rpks[0]}" "${{ matrix.output }}"
          ls -l "${{ matrix.output }}"

      - name: Verify RPK signature
        run: python3 vela/${{ matrix.project }}/tool/verify_rpk.py "${{ matrix.output }}" vela/${{ matrix.project }}/sign/release/certificate.pem

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.rpk'
          generate_release_notes: true
